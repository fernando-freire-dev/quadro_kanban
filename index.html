<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanban Lite | Fênix Digital</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/cards.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="topbar">

        <div class="logo">

            🦅 <span>Fênix Digital</span>

        </div>

        <h1>Kanban Lite</h1>

    </header>



    <!-- ================= DADOS DO PROJETO ================= -->

    <section class="project-area">

        <div class="project-input">

            <label>Projeto</label>

            <input
                type="text"
                id="nomeProjeto"
                placeholder="Digite o nome do projeto">

        </div>

        <div class="buttons">

            <button id="btnNovaTarefa">
                ➕ Nova Tarefa
            </button>

            <button id="btnExportar">
                🖨 Exportar PDF
            </button>

        </div>

    </section>



    <!-- ================= KANBAN ================= -->

    <main class="board">

        <section class="column">

            <div class="column-header ideas">

                💡 Ideias

            </div>

            <div class="cards" id="ideias">

            </div>

        </section>



        <section class="column">

            <div class="column-header todo">

                📋 A Fazer

            </div>

            <div class="cards" id="afazer">
			    <div class="empty">			
			        📌	<p>Arraste uma tarefa para cá</p>			
			    </div>
			
			</div>

        </section>



        <section class="column">

            <div class="column-header doing">

                ⚙ Em Andamento

            </div>

            <div class="cards" id="fazendo">
				<div class="empty">			
			        📌	<p>Arraste uma tarefa para cá</p>			
			    </div>

            </div>

        </section>



        <section class="column">

            <div class="column-header done">

                ✅ Concluído

            </div>

            <div class="cards" id="concluido">
				<div class="empty">			
			        📌	<p>Arraste uma tarefa para cá</p>			
			    </div>

            </div>

        </section>

    </main>



    <!-- ================= MODAL ================= -->

    <div class="modal hidden" id="modalNovaTarefa">

        <div class="modal-content">

            <h2>Nova Tarefa</h2>
			<input type="hidden" id="cardEditando">

            <div class="field">

                <label>Título</label>

                <input
                    type="text"
                    id="titulo">

            </div>

            <div class="field">

                <label>Descrição</label>

                <textarea
                    id="descricao"
                    rows="4"></textarea>

            </div>

            <div class="field">

                <label>Responsável</label>

                <input
                    type="text"
                    id="responsavel">

            </div>

            <div class="field">

                <label>Prioridade</label>

                <select id="prioridade">

                    <option value="baixa">🟢 Baixa</option>
                    <option value="media">🟡 Média</option>
                    <option value="alta">🔴 Alta</option>

                </select>

            </div>

            <div class="modal-buttons">

                <button id="btnCancelar">
                    Cancelar
                </button>

                <button id="btnSalvar">
                    Salvar
                </button>

            </div>

        </div>

    </div>

    <!-- ================= LIBS ================= -->

    <script src="libs/sortable.min.js"></script>
    <script src="libs/html2canvas.min.js"></script>
    <script src="libs/jspdf.min.js"></script>

    <!-- ================= JS ================= -->

    <script src="js/modal.js"></script>
	<script src="js/cards.js"></script>
	<script src="js/board.js"></script>
	<script src="js/export.js"></script>
	<script src="js/app.js"></script>

</body>

</html>
